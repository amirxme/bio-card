<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alievceo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Верхняя полоса -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="dot"></span>
            <span>ONLINE</span>
        </div>
        <div class="topbar-right">
            <span id="clock">00:00:00</span>
            <span class="divider-v"></span>
            <span>GMT+3</span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">

        <!-- Ник -->
        <section class="hero">
            <div class="hero-label">01 / BIO</div>
            <h1>
                ALIEV<br>
                CEO
            </h1>
            <div class="hero-meta">
                <span>@alievceo</span>
                <span class="sep">—</span>
                <span>MEMECOIN CREATOR</span>
            </div>
        </section>

        <!-- Монограмма вместо фото -->
        <section class="monogram-block">
            <div class="monogram-wrap">
                <span class="monogram">A</span>
                <div class="monogram-corner tl"></div>
                <div class="monogram-corner br"></div>
            </div>
            <div class="monogram-caption">
                <span>FIG. 01</span>
                <span>SIGN</span>
            </div>
        </section>

        <!-- Проекты -->
        <section class="projects-section">
            <div class="section-label">02 / PROJECTS</div>

            <a href="#" class="link-item">
                <span class="link-num">01</span>
                <span class="link-name">COIN NAME</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="#" class="link-item">
                <span class="link-num">02</span>
                <span class="link-name">COIN NAME</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="#" class="link-item">
                <span class="link-num">03</span>
                <span class="link-name">COIN NAME</span>
                <span class="link-arrow">↗</span>
            </a>
        </section>

        <!-- Контакты -->
        <section class="links-section">
            <div class="section-label">03 / CONTACTS</div>

            <a href="#" class="link-item">
                <span class="link-num">01</span>
                <span class="link-name">TELEGRAM</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="#" class="link-item">
                <span class="link-num">02</span>
                <span class="link-name">X / TWITTER</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="#" class="link-item">
                <span class="link-num">03</span>
                <span class="link-name">DEXSCREENER</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="#" class="link-item">
                <span class="link-num">04</span>
                <span class="link-name">EMAIL</span>
                <span class="link-arrow">↗</span>
            </a>
        </section>

        <!-- Подвал -->
        <footer class="footer">
            <span>© 2025</span>
            <span>alievceo</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
