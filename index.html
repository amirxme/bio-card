<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alievceo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="grid-bg"></div>
    <div class="noise"></div>

    <main class="container">

        <h1 class="reveal">
            <span data-text="aliev">aliev</span>
            <span data-text="ceo">ceo</span>
        </h1>

        <div class="status">
            <div class="status-block">
                <div class="status-line">
                    <span class="dot"></span>
                    <span>ONLINE</span>
                </div>
                <div class="status-meta">
                    <span>memecoin creator</span>
                    <span class="sep">/</span>
                    <span>based on solana</span>
                </div>
            </div>

            <div class="status-block status-block-split">
                <div class="status-col">
                    <div class="status-line">
                        <span class="dot"></span>
                        <span>LOCATION</span>
                    </div>
                    <div class="status-meta">
                        <span>dagestan, russia</span>
                    </div>
                </div>

                <div class="status-col status-col-right">
                    <div class="status-line">
                        <span class="dot"></span>
                        <span>VISITS</span>
                    </div>
                    <div class="status-meta">
                        <span id="viewCount">------</span>
                    </div>
                </div>
            </div>
        </div>

        <nav class="links">
            <a href="https://x.com/alievvceo" target="_blank" rel="noopener" class="link">
                <span class="link-num">01</span>
                <span class="link-name">X</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="https://t.me/alievvceo" target="_blank" rel="noopener" class="link">
                <span class="link-num">02</span>
                <span class="link-name">Telegram</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="https://pump.fun/join/alievceo" target="_blank" rel="noopener" class="link">
                <span class="link-num">03</span>
                <span class="link-name">Pump.fun</span>
                <span class="link-arrow">↗</span>
            </a>
            <a href="https://www.instagram.com/alievceo" target="_blank" rel="noopener" class="link">
                <span class="link-num">04</span>
                <span class="link-name">Instagram</span>
                <span class="link-arrow">↗</span>
            </a>
        </nav>

    </main>

    <script>
        const NS = 'alievceo';
        const KEY = 'visits';
        const STORAGE_KEY = 'alievceo_visited';

        async function initCounter() {
            const el = document.getElementById('viewCount');
            const isNew = !localStorage.getItem(STORAGE_KEY);

            try {
                const endpoint = isNew
                    ? `https://abacus.jasoncameron.dev/hit/${NS}/${KEY}`
                    : `https://abacus.jasoncameron.dev/get/${NS}/${KEY}`;

                const res = await fetch(endpoint);
                const data = await res.json();

                el.textContent = String(data.value).padStart(6, '0');

                if (isNew) {
                    localStorage.setItem(STORAGE_KEY, '1');
                }
            } catch {
                el.textContent = '------';
            }
        }

        initCounter();
    </script>

</body>
</html>
